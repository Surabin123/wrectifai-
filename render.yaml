databases:
  - name: wrectifai-db
    databaseName: wrectifai
    plan: free
    ipAllowList: []

services:
  - type: web
    name: wrectifai-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && npx nx build api --skip-nx-cache && node db/migrate.js && node db/seed-admin.js
    startCommand: node dist/api/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: wrectifai-db
          property: connectionString

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: WEB_ORIGINS
        fromService:
          type: web
          name: wrectifai-web
          envVarKey: RENDER_EXTERNAL_URL

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL
        value: llama-3.3-70b-versatile

      - key: DEMO_MODE
        value: "true"

      - key: OPENAI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: IMAGE_LLM_PROVIDER
        value: groq

      - key: IMAGE_LLM_MODEL
        value: llama-3.2-11b-vision-preview

      - key: AUDIO_PROVIDER
        value: groq

      - key: AUDIO_MODEL
        value: whisper-large-v3-turbo

  - type: web
    name: wrectifai-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start

    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: wrectifai-api
          envVarKey: RENDER_EXTERNAL_URL

      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: wrectifai-api
          envVarKey: RENDER_EXTERNAL_URL

      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false